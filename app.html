<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Campaign Prediction</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    width:420px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    padding:30px;
    box-shadow:0 8px 32px rgba(0,0,0,0.25);
    color:white;
}

h1{
    text-align:center;
    margin-bottom:8px;
    font-size:28px;
}

.subtitle{
    text-align:center;
    margin-bottom:25px;
    opacity:0.8;
    font-size:14px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:15px;
}

input::placeholder{
    color:rgba(255,255,255,0.7);
}

select option{
    color:black;
}

input:focus,
select:focus{
    background:rgba(255,255,255,0.3);
    transition:0.3s;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:white;
    color:#6a11cb;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(255,255,255,0.3);
}

.result{
    margin-top:20px;
    text-align:center;
    padding:12px;
    border-radius:10px;
    background:rgba(255,255,255,0.2);
    font-weight:600;
}
</style>
</head>

<body>

<div class="container">

    <h1>📊 Customer Segmentation</h1>
    <p class="subtitle">Campaign Acceptance Prediction System</p>

    <form>

        <div class="input-group">
            <label>Age</label>
            <input type="number" placeholder="Enter customer age">
        </div>

        <div class="input-group">
            <label>Annual Income</label>
            <input type="number" placeholder="Enter annual income">
        </div>

        <div class="input-group">
            <label>Spending Score</label>
            <input type="number" placeholder="Enter spending score">
        </div>

        <div class="input-group">
            <label>Previous Campaign Response</label>
            <select>
                <option>Select Response</option>
                <option>Accepted</option>
                <option>Rejected</option>
            </select>
        </div>

        <button type="button">
            Predict Campaign Acceptance
        </button>

    </form>

    <div class="result">
        Prediction Result Will Appear Here
    </div>

</div>

</body>
</html>
